name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=dev

      - name: Validate and package
        run: |
          npm run check
          npm run desktop:build

      - name: Create checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File -Filter 'KareMetin-*.exe' | Sort-Object Name
          $lines = foreach ($asset in $assets) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant(), $asset.Name
          }
          Set-Content -LiteralPath release/KareMetin-1.0.0-SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          First public Windows release of KareMetin.

          - Whisper Large v3 Turbo transcription with a one-time first-run model download, then local WebGPU/CPU operation.
          - Native FFmpeg exports, editable .karemetin projects, ZIP packages, and CLI automation.
          - English interface by default with an English/Turkish selector.

          Choose Setup for a normal Windows installation or Portable to run without installing. On first launch, an internet connection downloads the local AI model once; media is never uploaded. Verify the SHA-256 checksums before running a download. Windows may show a SmartScreen warning because this release is not code signed.
          "@
          gh release create "${{ inputs.tag }}" release/KareMetin-Setup-1.0.0-x64.exe release/KareMetin-Portable-1.0.0-x64.exe release/KareMetin-1.0.0-SHA256SUMS.txt --target "${{ github.sha }}" --title "KareMetin 1.0.0" --notes $notes --latest
